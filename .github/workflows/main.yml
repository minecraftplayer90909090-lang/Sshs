name: Build Launcher (Debug APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'assets/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 8 + 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Install NDK + build-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;25.2.9519653" "build-tools;34.0.0" "platforms;android-34"

      - name: Dummy google-services.json (only if needed)
        run: |
          F=app_pojavlauncher/google-services.json
          if ! grep -q "google-services" app_pojavlauncher/build.gradle; then echo "plugin not used, skipping"; exit 0; fi
          if [ -f "$F" ]; then echo "already exists, skipping"; exit 0; fi
          GR=app_pojavlauncher/build.gradle
          PKG=$(grep -hoE "applicationId[ =]+['\"][^'\"]+['\"]" $GR | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"]/\1/")
          SUF=$(grep -hoE "applicationIdSuffix[ =]+['\"][^'\"]+['\"]" $GR | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"]/\1/")
          [ -z "$PKG" ] && PKG="net.kdt.pojavlaunch"
          mk() {
            echo "{\"client_info\":{\"mobilesdk_app_id\":\"1:123456789012:android:$2\",\"android_client_info\":{\"package_name\":\"$1\"}},\"api_key\":[{\"current_key\":\"AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY000\"}],\"services\":{}}"
          }
          CLIENTS="$(mk "$PKG" 0123456789abcdef),$(mk "$PKG.debug" 0123456789abcde0)"
          [ -n "$SUF" ] && CLIENTS="$CLIENTS,$(mk "$PKG$SUF" 0123456789abcde1)"
          echo "{\"project_info\":{\"project_number\":\"123456789012\",\"project_id\":\"dummy-project\",\"firebase_url\":\"https://dummy-project-default-rtdb.firebaseio.com\",\"storage_bucket\":\"dummy-project.appspot.com\"},\"client\":[$CLIENTS],\"configuration_version\":\"1\"}" > "$F"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set +e
          ./gradlew :app_pojavlauncher:assembleDebug --console=plain --no-daemon > build.log 2>&1
          CODE=$?
          echo "=========== ERROR SUMMARY ==========="
          grep -n -A12 -E "What went wrong|FAILURE:|error:|Could not" build.log | head -60
          exit $CODE
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-debug-apk-${{ github.run_number }}
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
